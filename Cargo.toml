[package]
name = "xml-test"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
chrono = "0.4"
arrayvec = "0.7.8"
serde_path_to_error = "0.1.20"
reqwest = { version = "0.13", features = ["blocking", "cookies", "json", "query"] }
serde_json = "1.0.151"
zip = "8.6.0"
gdtf_derive = { path = "./gdtf_derive"}
bytes = "1.12.1"
